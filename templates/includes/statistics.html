{# Contadores Crafto (counter-style-07). Recibe `statistics`; quien lo incluye decide si se muestra. #}
                <div class="row row-cols-1 row-cols-md-4 row-cols-sm-2 justify-content-center counter-style-07">
                    {% for statistic in statistics %}
                    <!-- start counter item -->
                    <div class="col text-center{% if forloop.revcounter == 2 %} xs-mb-35px{% elif forloop.revcounter > 2 %} sm-mb-35px{% endif %}"{% if statistic.description %} title="{{ statistic.description }}"{% endif %}>
                        {% if statistic.prefix %}<span class="h1 alt-font text-dark-gray fw-700 mb-0 ls-minus-2px md-ls-0px">{{ statistic.prefix }}</span>{% endif %}<h1 class="alt-font vertical-counter d-inline-flex text-dark-gray fw-700 mb-0 ls-minus-2px md-ls-0px position-relative{% if forloop.first %} z-index-0{% endif %}" data-to="{{ statistic.value }}">
                            <span class="text-highlight position-absolute bottom-10px w-100"><span class="bg-base-color h-10px bottom-0px opacity-4"></span></span>
                        </h1>{% if statistic.suffix %}<span class="h1 alt-font text-dark-gray fw-700 mb-0 ls-minus-2px md-ls-0px">{{ statistic.suffix }}</span>{% endif %}
                        <span class="d-block fs-15 lh-20 fw-700 text-uppercase text-dark-gray">{{ statistic.title }}</span>
                    </div>
                    <!-- end counter item -->
                    {% endfor %}
                </div>
